<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>연개소문은 영웅인가, 빌런인가?</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            padding: 20px;
            background: #090d12;
        }

        .rank-banner {
            display: block;
            width: min(100%, 640px);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .rank-banner:hover {
            transform: translateY(-3px);
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.68);
        }

        .rank-banner:focus-visible {
            outline: 3px solid #e3b74f;
            outline-offset: 5px;
        }

        .rank-banner img {
            display: block;
            width: 100%;
            height: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            .rank-banner {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <a
        class="rank-banner"
        href="https://www.koreamanri.com/ranking.html"
        aria-label="고려만리지도 영웅과 빌런 랭킹으로 이동"
    >
        <img
            src="/public/assets/yeon-gaesomun-rank-banner.png"
            alt="연개소문은 영웅인가, 빌런인가? 당신의 선택은?"
            width="1003"
            height="1568"
        >
    </a>
</body>
</html>
